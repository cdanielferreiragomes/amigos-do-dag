<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F5135">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Amigos do Dag">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Amigos do Dag</title>
<style>
:root{
  /* 60 — cal (linhas do campo) */
  --cal:#EEF2EC; --surface:#FFFFFF; --surface-2:#E2E9E0; --line:#D3DCD0;
  --ink:#15241B; --ink-2:#55695B;
  /* 30 — gramado */
  --grama:#1F5135; --grama-2:#2B6B47; --on-grama:#F1F5EF; --grama-soft:#D9E7DC; --grama-ink:#1F5135;
  /* 10 — colete */
  --colete:#FF7A1A; --on-colete:#1C1105; --colete-soft:#FFE5CF;
  --danger:#B42318; --aviso-bg:#FFF1DC; --aviso-line:#EDB15F;
  --f-num:"DIN Condensed","Avenir Next Condensed","Roboto Condensed","sans-serif-condensed","Arial Narrow",sans-serif;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r-lg:20px; --r-md:14px; --r-sm:8px; --ok-ink:#1E7A3C;
  --nav-h:64px;
}
@media (prefers-color-scheme:dark){
  :root{
    --cal:#0E1813; --surface:#15231B; --surface-2:#1D3026; --line:#2A3E33;
    --ink:#E5EEE8; --ink-2:#9BB0A2;
    --grama:#163C27; --grama-2:#3F8B5F; --on-grama:#E5EEE8; --grama-soft:#1E3A2A; --grama-ink:#9CD4B1;
    --colete-soft:#3E2512; --aviso-bg:#3A2A13; --aviso-line:#8C5D20; --danger:#FF8A7A; --ok-ink:#7BD69A;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cal);color:var(--ink);font:16px/1.45 var(--f-ui);min-height:100dvh}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--colete);outline-offset:2px;border-radius:6px}
svg{display:block;flex:none}

/* ---------- barra superior (30) ---------- */
.bar{position:sticky;top:0;z-index:10;background:var(--grama);color:var(--on-grama);padding:calc(env(safe-area-inset-top) + 12px) 16px 12px}
.bar-in{max-width:640px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{display:block;font-size:13px;font-weight:700;opacity:.8;margin-bottom:2px}
.bar h1{margin:0;font:700 32px/1 var(--f-num);letter-spacing:.01em}
.bar p{margin:0;font-size:14px;opacity:.82;text-align:right}
.banner{background:var(--danger);color:#fff;font-size:14px;padding:8px 16px;text-align:center}

main{max-width:640px;margin:0 auto;padding:16px 16px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom))}

/* ---------- navegação (30 + 10 na aba ativa) ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--grama);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav-in{max-width:640px;margin:0 auto;display:flex}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:var(--nav-h);padding:6px 0 4px;color:var(--on-grama);opacity:.72;font-size:12px;font-weight:600}
.nav button .ic{padding:4px 16px;border-radius:999px;transition:background .2s}
.nav button.on{opacity:1}
.nav button.on .ic{background:var(--colete);color:var(--on-colete)}

/* ---------- campos ---------- */
.field{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:0 6px 0 14px;min-height:52px;color:var(--ink-2)}
.field:focus-within{border-color:var(--grama-2)}
.field input{flex:1;min-width:0;border:0;background:none;outline:none;height:50px;font-size:17px;color:var(--ink)}
.field input::placeholder{color:var(--ink-2)}
input[type=search]::-webkit-search-cancel-button{display:none}
.field-x{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--ink-2)}
select{width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:var(--r-md);background:var(--surface);padding:0 12px;font-size:16px;color:var(--ink)}
.txt{width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:var(--r-md);background:var(--surface);padding:0 14px;font-size:18px;color:var(--ink);outline:none}
.txt:focus{border-color:var(--grama-2)}

/* ---------- textos ---------- */
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:24px 2px 8px;width:calc(100% - 4px);text-align:left}
.sec h2{margin:0;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.count{font:700 18px/1 var(--f-num);background:var(--surface-2);color:var(--ink-2);border-radius:999px;padding:4px 9px 3px}
.hint{font-size:14px;color:var(--ink-2);margin:0 2px 10px}
.hint svg{display:inline-block;vertical-align:-3px}
.muted{font-size:14px;color:var(--ink-2);margin:6px 0 0}
.link{color:var(--grama-ink);font-weight:700;font-size:15px;padding:8px 6px;border-radius:8px}
.lbl{display:block;font-size:14px;font-weight:600;color:var(--ink-2);margin:16px 0 8px}
.lbl:first-child{margin-top:0}

/* ---------- posição e nível ---------- */
.pos{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;line-height:1.5}
.pos-G{background:#FCECC2;color:#6E4B00}.pos-D{background:#DCE8FA;color:#1D4C93}
.pos-M{background:#DCEFDF;color:#1F5A32}.pos-A{background:#FBE0DA;color:#8E2A1A}
.pos-L{background:#EAE0F7;color:#57308F}
.pos.alt{background:none;box-shadow:inset 0 0 0 1px currentColor;opacity:.8}
@media (prefers-color-scheme:dark){
  .pos-G{background:#3D3112;color:#F2CF73}.pos-D{background:#18294A;color:#9BC0F5}
  .pos-M{background:#173622;color:#93D5A6}.pos-A{background:#43201A;color:#F4A796}
  .pos-L{background:#2E2142;color:#CDB3F2}
}
.pips{display:inline-flex;gap:3px;align-items:center}
.pips i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--grama-2)}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.who{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;text-align:left}
.nm{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.tag{font-size:12px;font-weight:600;color:var(--ink-2);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.tag-here{color:var(--grama-ink);border-color:var(--grama-2)}

/* ---------- busca de chegada ---------- */
.finder{position:relative}
.qres{margin-top:8px;background:var(--surface);border:1.5px solid var(--grama-2);border-radius:var(--r-md);overflow:hidden}
.qres:empty{display:none}
.qres .note{padding:14px;font-size:15px;color:var(--ink-2)}

/* ---------- placar da fila ---------- */
.tally{display:flex;gap:0;margin:16px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.tally div{flex:1;padding:12px 8px 10px;text-align:center}
.tally div+div{border-left:1px solid var(--line)}
.tally b{display:block;font:700 34px/1 var(--f-num);font-variant-numeric:tabular-nums}
.tally div:first-child b{color:var(--grama-ink)}
.tally span{font-size:13px;color:var(--ink-2)}

/* ---------- fila arrastável ---------- */
.queue{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.qrow{display:flex;align-items:center;gap:4px;min-height:66px;padding:6px 2px 6px 6px;border-top:1px solid var(--line);background:var(--surface);position:relative}
.qrow:first-child{border-top:0;border-radius:var(--r-lg) var(--r-lg) 0 0}
.qrow:last-child{border-radius:0 0 var(--r-lg) var(--r-lg)}
.qrow:only-child{border-radius:var(--r-lg)}
.jersey{flex:none;width:52px;height:52px;display:grid;place-items:center;border-radius:12px;font:700 34px/1 var(--f-num);color:var(--grama-ink);font-variant-numeric:tabular-nums;padding-top:3px}
.jersey:active{background:var(--grama-soft)}
.is-bench .jersey{color:var(--ink-2);opacity:.55}
.is-bench .nm{color:var(--ink-2)}
.icon-btn{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--ink-2)}
.icon-btn:active{background:var(--surface-2)}
.handle{flex:none;width:48px;height:56px;display:grid;place-items:center;color:var(--ink-2);touch-action:none;cursor:grab;border-radius:12px}
.handle:active{cursor:grabbing;background:var(--surface-2)}
.queue.sorting{-webkit-user-select:none;user-select:none}
.queue.sorting .qrow{transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.queue.sorting .qrow.dragging{transition:none;z-index:5;border-radius:var(--r-md);border-top-color:transparent;box-shadow:0 14px 30px rgb(0 0 0/.22),0 0 0 2px var(--colete)}
.flash{animation:flash 1.3s ease-out}
@keyframes flash{0%,30%{background:var(--colete-soft)}100%{background:var(--surface)}}

/* ---------- listas simples ---------- */
.plain{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.arow{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:8px 12px 8px 16px;border-top:1px solid var(--line);text-align:left}
.arow:first-child{border-top:0}
.arow:active{background:var(--surface-2)}
.arow .go{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:var(--grama-soft);color:var(--grama-ink)}
.arow.is-in{opacity:.6}

/* ---------- filtros ---------- */
.filters{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 12px;padding:0 16px 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.filters button span{font:700 17px/1 var(--f-num);color:var(--ink-2)}
.filters button.on{background:var(--grama);border-color:var(--grama);color:var(--on-grama)}
.filters button.on span{color:var(--on-grama);opacity:.8}

/* ---------- botões ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border-radius:var(--r-md);font-weight:700;font-size:16px;padding:0 16px}
.btn+.btn{margin-top:10px}
.btn-pri{background:var(--grama);color:var(--on-grama)}
.btn-out{border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.btn-danger{border:1.5px solid var(--danger);color:var(--danger);background:var(--surface)}
.cta{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:60px;margin:16px 0;border-radius:var(--r-lg);background:var(--colete);color:var(--on-colete);font:700 26px/1 var(--f-num);letter-spacing:.01em;padding-top:3px;box-shadow:0 6px 0 rgb(0 0 0/.14)}
.cta:active{transform:translateY(3px);box-shadow:0 3px 0 rgb(0 0 0/.14)}
.fab{position:fixed;z-index:9;right:max(16px,calc(50% - 304px));bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:18px;background:var(--colete);color:var(--on-colete);display:grid;place-items:center;box-shadow:0 8px 20px rgb(0 0 0/.25)}
.fab:active{transform:scale(.95)}
.row2{display:flex;gap:10px}
.row2 .btn{margin:0}

/* ---------- segmentos, passo, chave ---------- */
.seg{display:flex;gap:4px;background:var(--surface-2);border-radius:var(--r-md);padding:4px}
.seg button{flex:1;min-height:46px;border-radius:10px;font-size:15px;font-weight:600;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.15)}
.seg small{font-size:12px;font-weight:600}
.stepper{display:flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:var(--r-md);padding:4px;width:max-content}
.stepper button{width:50px;height:46px;border-radius:10px;display:grid;place-items:center;background:var(--surface);color:var(--ink)}
.stepper button:disabled{opacity:.4}
.stepper b{min-width:52px;text-align:center;font:700 32px/1 var(--f-num);padding-top:3px}
.stepper input{width:70px;text-align:center;border:0;background:none;font:700 34px/1 var(--f-num);color:var(--ink);outline:none;padding-top:3px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;text-align:left;font-size:16px;font-weight:600}
.switch i{flex:none;width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0/.3);transition:transform .2s}
.switch[aria-checked=true] i{background:var(--grama-2)}
.switch[aria-checked=true] i::after{transform:translateX(20px)}

/* ---------- blocos ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.panel+.panel{margin-top:12px}
.empty{text-align:center;padding:32px 20px;color:var(--ink-2)}
.empty svg{margin:0 auto 10px;color:var(--grama-2)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.empty p{margin:0 auto 18px;max-width:34ch;font-size:15px}
.empty .btn{max-width:320px;margin-left:auto;margin-right:auto}
.alert{background:var(--aviso-bg);border:1px solid var(--aviso-line);border-radius:var(--r-md);padding:12px 14px;margin:0 0 12px;font-size:15px}
.alert p{margin:0}
.alert p+p{margin-top:6px}
.note-ok{display:flex;gap:8px;align-items:center;color:var(--grama-ink);font-weight:600;font-size:15px;margin:0 2px 12px}
.plan-line{font-size:15px;color:var(--ink-2);margin:14px 0 0}
.plan-line b{color:var(--ink)}

/* ---------- força dos times ---------- */
.balance{padding:14px 16px}
.bal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.bal-h h2{margin:0;font-size:17px}
.badge{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px}
.badge.good{background:var(--grama-soft);color:var(--grama-ink)}
.badge.ok{background:var(--surface-2);color:var(--ink)}
.badge.bad{background:var(--aviso-bg);color:var(--ink);border:1px solid var(--aviso-line)}
.bal-row{display:grid;grid-template-columns:76px 1fr 32px;align-items:center;gap:10px;font-size:14px;margin-top:6px}
.bal-bar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bal-bar i{display:block;height:100%;border-radius:5px}
.bal-row b{font:700 22px/1 var(--f-num);text-align:right;padding-top:2px}

/* ---------- times ---------- */
.team{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-top:12px;overflow:hidden}
.team-h{display:flex;align-items:center;gap:12px;padding:12px 16px 10px}
.bib{width:24px;height:28px;background:var(--tc);clip-path:polygon(28% 0,72% 0,76% 14%,100% 24%,100% 100%,0 100%,0 24%,24% 14%)}
.team-h h3{margin:0;flex:1;font:700 28px/1 var(--f-num);padding-top:3px}
.team-sum{font:700 22px/1 var(--f-num);color:var(--ink-2);padding-top:2px}
.team-pos{padding:0 16px 10px 52px;font-size:13px;color:var(--ink-2)}
.team ul,.bench ul{list-style:none;margin:0;padding:0}
.tli{display:flex;align-items:center;border-top:1px solid var(--line);background:var(--surface);position:relative}
.tli::after{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:var(--danger);opacity:.22;pointer-events:none}
.tli.holding::after{width:100%;transition:width 1.5s linear}
.trow{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.trow{display:flex;align-items:center;gap:12px;flex:1;min-width:0;min-height:46px;padding:6px 4px 6px 16px;text-align:left}
.thandle{flex:none;width:48px;height:46px;display:grid;place-items:center;color:var(--ink-2);touch-action:none;cursor:grab}
.thandle:active{cursor:grabbing}
.tli.lifted{opacity:.3}
.tli.drop-swap{background:var(--colete-soft);box-shadow:inset 0 0 0 2px var(--colete)}
.team.drop-into,.bench.drop-into{box-shadow:0 0 0 3px var(--colete);border-color:transparent}
.tli.ghost{position:fixed;z-index:60;pointer-events:none;margin:0;border:0;border-radius:var(--r-md);box-shadow:0 14px 30px rgb(0 0 0/.25),0 0 0 2px var(--colete);list-style:none}
body.tdragging{-webkit-user-select:none;user-select:none}
.trow .nm{flex:1;font-size:16px}
.trow .pos{min-width:68px;text-align:center}
.trow.sel{background:var(--colete-soft);box-shadow:inset 4px 0 0 var(--colete)}
.bench{margin-top:12px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-lg);overflow:hidden}
.bench h3{margin:0;padding:12px 16px 10px;font-size:17px;display:flex;align-items:center}

/* ---------- sorteio enxuto ---------- */
.topo{display:flex;gap:10px;align-items:stretch;margin:0 0 12px}
.cfg-bar{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:50px;padding:0 12px 0 14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:15px;color:var(--ink)}
.cfg-bar.cfg-open{margin:0 0 10px;min-height:44px}
.cta.sm{flex:1;min-height:50px;margin:0;font-size:21px;gap:8px;box-shadow:0 4px 0 rgb(0 0 0/.14)}
.topo .cta.sm{margin:0}
.bal-min{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:12px 14px;margin-top:12px}
.bal-min h2{margin:0;flex:1;font-size:16px}
.bal-min svg,.bal-h svg{flex:none;color:var(--ink-2)}
button.bal-h{width:100%;text-align:left;gap:8px}
button.bal-h h2{flex:1}
.pick-bar{position:sticky;top:calc(var(--bar-h,64px) + 6px);z-index:5;margin:12px 0 0;padding:10px 14px;border-radius:var(--r-md);background:var(--colete-soft);border:1px solid var(--colete);font-size:15px;font-weight:600}
.jogo-f{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px}
.jogo-f .hist{margin:0}
.jogo-f .voltar{margin:0}
.bench h3 .leg{display:inline-flex;align-items:center;gap:5px;padding:0;margin-left:8px}
/* ---------- jogo em andamento ---------- */
.jogo{margin-top:0}
.jogo-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.jogo-h h2{margin:0;font:700 30px/1 var(--f-num);padding-top:3px}
.vs{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.vs span{display:inline-flex;align-items:center;gap:6px}
.vs i{width:10px;height:10px;border-radius:3px;display:block}
.vs small{color:var(--ink-2);font-size:14px}
.jogo .row2{margin-top:12px}
.btn.lost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--tc);gap:8px;padding:0 8px;font-size:15px;line-height:1.15}
.btn.lost .bib{width:18px;height:21px;flex:none}
.btn.lost:active{background:var(--surface-2)}
.hist{font-size:13px;color:var(--ink-2);margin:12px 0 0}
.jogo .voltar{display:inline-flex;align-items:center;gap:6px;margin:8px 0 -6px -2px;padding:6px 2px;font-size:14px;color:var(--ink-2);font-weight:600}
.tstate{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.tstate.on{background:var(--grama-soft);color:var(--grama-ink)}
.bench h3 small{font:500 13px/1 var(--f-ui);color:var(--ink-2);margin-left:4px}
.tli>.ord{flex:none;margin-left:12px;width:34px;height:34px;border-radius:10px;background:var(--surface-2);color:var(--ink);font:700 18px/1 var(--f-num);display:grid;place-items:center;padding-top:2px}
.tli>.ord:active{box-shadow:0 0 0 2px var(--colete)}

const POS=['G','D','L','M','A'];

const POS_PL={G:['goleiro','goleiros'],D:['zagueiro','zagueiros'],L:['lateral','laterais'],M:['meia','meias'],A:['atacante','atacantes']};

const NL=4;
/* lista da turma: nome, posição, segunda posição, nível */
const TURMA=[
  ['Ailton','D',null,1],['Alan','M',null,4],['Alan Romão','M',null,4],['Alex','D',null,2],
  ['Bruno','A','M',3],['Daniel','M',null,4],['Boca','L',null,2],['Cleomar','L','M',4],
  ['Dag','L',null,1],['Elison','M',null,4],['Fabio','M',null,4],['Fernando','G',null,4],

  ['Jefinho','M',null,4],['Jonatas','M',null,4],['Leão','D',null,4],['Lukinha Lucaneta','M',null,4],

  ['Piolho','L',null,2],['Renato','M',null,3],['Ronaldo','A',null,3],['Samuel','A',null,4],
  ['Tiago','G',null,4],['Tiago Santos','M',null,3],['Valtair','L',null,2],['Vitor','M',null,4],
  ['Will','A',null,4],['Amarildo','M',null,2],['Zéca','L',null,3],['Julio Freitas','M',null,4],
  ['Matias','D','L',3],['Tarlan','G',null,4],['Vinicius','M',null,4],['Pedrinho','A',null,4],
  ['Wesley','L',null,4],['Gazola','A','M',3],['Lucas Chaves','M',null,4],['Rafael','D',null,3]
];
/* regras que já vêm com a lista: sep = nunca no mesmo time, tog = sempre juntos */
const TURMA_REGRAS=[];
/* sobe quando entra jogador novo na TURMA: quem já usa o app recebe só os que faltam */
const TURMA_V=7;
/* ajustes de nível da lista oficial: [nome, nível anterior, nível novo]. Só muda quem ainda está no valor anterior,
   então uma edição feita à mão no aparelho é preservada. */
const AJUSTES_NIVEL=[[5,'amarildo',3,2],[5,'bruno',4,3],[5,'gazola',4,2],[5,'renato',4,3],[5,'tiago santos',4,3],
  [7,'gazola',2,3],[7,'matias',4,3],[7,'alex',null,2]];
/* escala de níveis passou de 3 para 4 (Extra forte). Quem tem dados antigos é convertido uma vez:
   Forte(3)->Extra forte(4), Médio(2)->Forte(3), exceto estes quatro que seguem Médio. */
const NIVEL_V=2, NIVEL_MANTER=new Set(['alex','guina','boca','piolho','valtair']);
const nivelNovo=(nomeNorm,l)=>l===3?4:(l===2&&!NIVEL_MANTER.has(nomeNorm)?3:l);
const TEAMS=[{n:'Vermelho',c:'#D33A2C',e:'🔴'},{n:'Azul',c:'#2563C9',e:'🔵'},{n:'Amarelo',c:'#E3AE00',e:'🟡'}];
const pips=n=>`<span class="pips" role="img" aria-label="Nível ${LEVEL_NAME[n]}">${[1,2,3,4].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span>`;
const posTag=(k,alt)=>`<span class="pos pos-${k}${alt?' alt':''}">${POS_NAME[k]}</span>`;
const posTags=p=>posTag(p.pos)+(p.pos2?posTag(p.pos2,true):'');

/* lista com os convidados separados no fim, sob um divisor */
function withGuests(list,fn){
  let h='',shown=false;
  list.forEach(p=>{if(p.guest&&!shown){shown=true;h+='<div class="divl">Convidados</div>';}h+=fn(p);});

/* ================= estado e armazenamento ================= */
/* ================= caixa: núcleo ================= */
const CAT={
  mens:{n:'Mensalidade',in:true},
  diaria:{n:'Diária',in:true},

};
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const r2=x=>Math.round(x*100)/100;
const brl=v=>(v<0?'−':'')+'R$ '+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const brlS=v=>(v>0?'+':'')+brl(v);
const curYM=()=>today().slice(0,7);
const addYM=(ym,k)=>{let y=+ym.slice(0,4),m=+ym.slice(5,7)+k;while(m>12){m-=12;y++;}while(m<1){m+=12;y--;}return y+'-'+pad(m);};
const ymLabel=ym=>{const m=MESES[+ym.slice(5,7)-1];return m.charAt(0).toUpperCase()+m.slice(1)+' de '+ym.slice(0,4);};
const ymShort=ym=>MESES[+ym.slice(5,7)-1].slice(0,3)+'/'+ym.slice(2,4);
const dShort=d=>d.slice(8,10)+'/'+d.slice(5,7);
const dLong=d=>d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4);
const dayOffset=k=>{const x=new Date();x.setDate(x.getDate()+k);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());};
const parseMoney=v=>{const t=String(v??'').trim().replace(/^r\$\s*/i,'');if(!t)return 0;return t.includes(',')?+t.replace(/\./g,'').replace(',','.'):+t;};
/* um lançamento: id, data, valor (+ entrada, − saída), categoria, atleta (id e nome guardado), mês de referência da mensalidade, descrição */
function txClean(x,ids){
  const d=/^\d{4}-\d\d-\d\d$/.test(x.d)?x.d:today();
  const cat=CAT[x.cat]?x.cat:((+x.v||0)>=0?'entrada':'despesa');
  const v=r2(Math.abs(+x.v||0))*(CAT[cat].in?1:-1);
  const pid=(x.pid!=null&&x.pid!==''&&(!ids||ids.has(+x.pid)))?+x.pid:null;
  const t={id:+x.id||0,d,v,cat,pid,nome:String(x.nome||''),desc:String(x.desc||'')};
  if(cat==='mens')t.ref=/^\d{4}-\d\d$/.test(x.ref)?x.ref:d.slice(0,7);
  return t;
}
const blankFin=()=>({cfg:{mens:30,diaria:10,local:0,saldoIni:0},tx:[],nextTx:1});

const blank=()=>({v:2,players:[],rules:[],queue:[],day:'',nTeams:2,size:9,showLevels:true,nextId:1,last:null,seeded:false,evals:{},fin:blankFin(),lastBackup:0});
function turmaInto(s){
  const old=s.players||[];
  s.players=[];s.rules=[];s.queue=[];s.last=null;s.nextId=1;s.seeded=true;s.turmaV=TURMA_V;s.nivelV=NIVEL_V;
  TURMA.forEach(([name,pos,pos2,level])=>s.players.push({id:s.nextId++,name,pos,pos2,level}));
  const id=n=>s.players.find(p=>p.name===n).id;
  TURMA_REGRAS.forEach(([a,b,t])=>s.rules.push({a:id(a),b:id(b),t}));
  const nid=i=>{const o=old.find(p=>p.id===i);if(!o)return null;const n=s.players.find(p=>norm(p.name)===norm(o.name));return n?n.id:null;};
  if(s.fin)s.fin.tx.forEach(t=>{if(t.pid!=null)t.pid=nid(t.pid);});
  return s;
}
let storageOk=true;

function sanitize(d){
  const s=Object.assign(blank(),d||{});
  s.players=(Array.isArray(s.players)?s.players:[]).filter(p=>p&&p.name).map(p=>{
    const pos=POS.includes(p.pos)?p.pos:'M';
    const pos2=(pos!=='G'&&LINE.includes(p.pos2)&&p.pos2!==pos)?p.pos2:null;
    return {id:+p.id,name:String(p.name),level:[1,2,3,4].includes(+p.level)?+p.level:2,pos,pos2,guest:!!p.guest};
  });
  if((s.nivelV||1)<NIVEL_V){
    s.players.forEach(p=>{p.level=nivelNovo(norm(p.name),p.level);});
    Object.values(s.evals&&typeof s.evals==='object'?s.evals:{}).forEach(ev=>Object.entries(ev||{}).forEach(([k,v])=>{if(v&&v.l)v.l=nivelNovo(k,v.l);}));
    s.nivelV=NIVEL_V;
  }
  const ids=new Set(s.players.map(p=>p.id));
  s.rules=(Array.isArray(s.rules)?s.rules:[]).filter(r=>ids.has(r.a)&&ids.has(r.b)&&r.a!==r.b).map(r=>({a:r.a,b:r.b,t:r.t==='tog'?'tog':'sep'}));
  s.queue=[...new Set((Array.isArray(s.queue)?s.queue:[]).filter(id=>ids.has(id)))];
  s.nTeams=[2,3].includes(+s.nTeams)?+s.nTeams:2;
  s.size=Math.min(11,Math.max(4,+s.size||9));
  s.nextId=Math.max(+s.nextId||1,...s.players.map(p=>p.id+1));
  if(s.last){const all=[].concat(...(s.last.teams||[]),s.last.bench||[]);if(!all.every(id=>ids.has(id)))s.last=null;}
  if(s.last&&(!s.last.roles||typeof s.last.roles!=='object'))s.last.roles={};
  if(s.last){
    const L=s.last, T=(L.teams||[]).length, pl=Array.isArray(L.play)?L.play.map(Number):[];
    L.play=pl.length===2&&pl[0]!==pl[1]&&pl.every(t=>t>=0&&t<T)?pl:[0,1];
    L.jogo=Math.max(1,Math.floor(+L.jogo||1));
    L.hist=Array.isArray(L.hist)?L.hist.filter(h=>h&&h.p>=0&&h.p<T):[];

  }
  if(s.players.length)s.seeded=true;
  if(!s.evals||typeof s.evals!=='object'||Array.isArray(s.evals))s.evals={};
  /* caixa */
  const f=(s.fin&&typeof s.fin==='object')?s.fin:{}, bf=blankFin(), cfg=Object.assign({},bf.cfg,f.cfg||{});
  Object.keys(bf.cfg).forEach(k=>{cfg[k]=r2(+cfg[k]||0);});
  const tx=(Array.isArray(f.tx)?f.tx:[]).filter(x=>x&&typeof x==='object').map(x=>txClean(x,ids));
  let next=Math.max(+f.nextTx||1,...tx.map(t=>t.id+1));
  tx.forEach(t=>{if(!t.id)t.id=next++;});
  s.fin={cfg,tx,nextTx:next};
  s.lastBackup=+s.lastBackup||0;
  return s;
}

/* ================= sorteio ================= */
function plan(){
  const T=S.nTeams;
  const q=S.queue.map(P).filter(Boolean);
  const gk=q.filter(p=>p.pos==='G'), ln=q.filter(p=>p.pos!=='G');
  const selG=gk.slice(0,T), selL=ln.slice(0,T*(S.size-1));
  const sel=selG.concat(selL), inSel=new Set(sel);
  return {q,selG,selL,sel,bench:q.filter(p=>!inSel.has(p))};
}
const sigOf=pl=>pl.sel.map(p=>p.id).sort((a,b)=>a-b).join(',');

/* equilíbrio por setor: Defesa (zagueiros + laterais), Meio e Ataque.
   Peso: o grupo reclama mais do meio, depois da defesa; o ataque pesa pouco. 'aviso' = diferença média que merece alerta. */
const SETOR=[{k:'D',n:'Defesa',pos:['D','L'],w:80,aviso:1},{k:'M',n:'Meio',pos:['M'],w:100,aviso:.8},{k:'A',n:'Ataque',pos:['A'],w:25,aviso:99}];
let SETOR_ESCALA=6, COUNT_HARD=300;
const SETOR_DE=Object.fromEntries(SETOR.flatMap((x,i)=>x.pos.map(p=>[p,i])));
/* nível médio e quantidade de cada setor por time (goleiro fora) */
function setorStats(L){
  return SETOR.map(x=>{
    const t=L.teams.map(ids=>{const v=ids.filter(id=>x.pos.includes(roleOf(L,id))).map(id=>P(id).level);return {n:v.length,avg:v.length?v.reduce((a,b)=>a+b,0)/v.length:0};});
    const av=t.map(q=>q.avg);
    return {x,t,gap:Math.max(...av)-Math.min(...av)};
  });
}
const fmt1=v=>v.toFixed(1).replace('.',',');
function run(){
  const T=S.nTeams, pl=plan(), sel=pl.sel, n=sel.length, nG=pl.selG.length;
  if(n<T*2)return {err:`Marque a chegada de pelo menos ${T*2} jogadores para sortear ${T} times.`};
  const isG=sel.map(p=>p.pos==='G'), lv=sel.map(p=>p.level);
  /* quem tem segunda posição pode ser escalado em qualquer uma das duas */
  const opts=sel.map(p=>p.pos2?[POS.indexOf(p.pos),POS.indexOf(p.pos2)]:[POS.indexOf(p.pos)]);
  const flex=sel.map((p,i)=>i).filter(i=>opts[i].length>1);
  const NP=POS.length, NG=NP+NP*NL+NL, NS=SETOR.length, SEC=POS.map(p=>SETOR_DE[p]??-1);
  const idx=new Map(sel.map((p,i)=>[p.id,i]));
  const rr=S.rules.filter(r=>idx.has(r.a)&&idx.has(r.b)).map(r=>({i:idx.get(r.a),j:idx.get(r.b),sep:r.t==='sep'}));

  function cost(team,role){
    const a=new Int16Array(NG*T), sum=new Int16Array(T), ss=new Int16Array(NS*T), sn=new Int16Array(NS*T);
    for(let i=0;i<n;i++){
      const t=team[i], pi=role[i], l=lv[i]-1;
      a[pi*T+t]++;
      if(!isG[i]){a[(NP+pi*NL+l)*T+t]++;a[(NP+NP*NL+l)*T+t]++;sum[t]+=lv[i];const sc=SEC[pi];if(sc>=0){ss[sc*T+t]+=lv[i];sn[sc*T+t]++;}}
    }
    let c=0;
    for(let g=0;g<NG;g++){
      let m=0;for(let t=0;t<T;t++)m+=a[g*T+t];m/=T;
      let d=0;for(let t=0;t<T;t++){const x=a[g*T+t]-m;d+=x*x;}
      c+=d*(g<NP?40:g<NP+NP*NL?15:8);
    }
    let m=0;for(let t=0;t<T;t++)m+=sum[t];m/=T;
    for(let t=0;t<T;t++){const x=sum[t]-m;c+=x*x*12;}
    /* nenhum time pode ficar com 2 ou mais jogadores a mais numa mesma posição de linha */
    if(COUNT_HARD){for(let g=1;g<NP;g++){let mx=-1,mn=99;for(let t=0;t<T;t++){const v=a[g*T+t];if(v>mx)mx=v;if(v<mn)mn=v;}if(mx-mn>1)c+=COUNT_HARD*(mx-mn-1);}}
    if(SETOR_ESCALA){
      for(let q=0;q<NS;q++){
        const av=[];let mm=0;
        for(let t=0;t<T;t++){const k=sn[q*T+t];av[t]=k?ss[q*T+t]/k:0;mm+=av[t];}
        mm/=T;let d=0;for(let t=0;t<T;t++){const x=av[t]-mm;d+=x*x;}
        c+=d*SETOR[q].w*SETOR_ESCALA;
      }
    }
    for(const r of rr){const same=team[r.i]===team[r.j];if(r.sep?same:!same)c+=1000;}
    return c;
  }
  function initial(){
    const team=new Array(n);
    shuffle([...Array(nG).keys()]).forEach((i,k)=>{team[i]=k;});
    const li=shuffle(Array.from({length:n-nG},(_,k)=>k+nG));
    const order=shuffle([...Array(T).keys()]);
    const L=li.length, base=Math.floor(L/T), ex=L%T;
    let p=0;order.forEach((t,k)=>{const m=base+(k<ex?1:0);for(let j=0;j<m;j++)team[li[p++]]=t;});
    return team;
  }
  const results=[];
  const batch=()=>{for(let r=0;r<160;r++){
    const team=initial();
    const role=opts.map(o=>o[Math.floor(Math.random()*o.length)]);
    let c=cost(team,role);
    for(let k=0;k<600;k++){
      if(flex.length&&Math.random()<.25){
        const i=flex[Math.floor(Math.random()*flex.length)], old=role[i];
        role[i]=opts[i][0]===old?opts[i][1]:opts[i][0];
        const c2=cost(team,role);
        if(c2<=c)c=c2;else role[i]=old;
        continue;
      }
      const i=Math.floor(Math.random()*n), j=Math.floor(Math.random()*n);
      if(team[i]===team[j]||isG[i]!==isG[j])continue;
      [team[i],team[j]]=[team[j],team[i]];
      const c2=cost(team,role);
      if(c2<=c)c=c2;else[team[i],team[j]]=[team[j],team[i]];
    }
    results.push({team,role,c});
  }};
  const pick=()=>{const min=Math.min(...results.map(x=>x.c));const pool=results.filter(x=>x.c<=min+12);return pool[Math.floor(Math.random()*pool.length)];};
  const build=best=>{const teams=Array.from({length:T},()=>[]), roles={};sel.forEach((p,i)=>{teams[best.team[i]].push(p.id);roles[p.id]=POS[best.role[i]];});return {teams,roles};};
  batch();
  let {teams,roles}=build(pick());
  /* se algum setor ainda ficou muito desigual, tenta mais (até 2 rodadas extras) */
  for(let tent=0;tent<2&&setorStats({teams,roles}).some(q=>q.gap>=q.x.aviso);tent++){batch();({teams,roles}=build(pick()));}
  return {teams,roles,bench:pl.bench.map(p=>p.id),short:Math.max(0,T*(S.size-1)-pl.selL.length),sig:sigOf(pl),at:Date.now(),play:[0,1],jogo:1,hist:[]};
}
const roleOf=(L,id)=>(L.roles&&L.roles[id])||P(id).pos;

function evaluate(L,ess){
  const w=[], tOf=new Map();
  L.teams.forEach((ids,t)=>ids.forEach(id=>tOf.set(id,t)));
  S.rules.forEach(r=>{
    if(!tOf.has(r.a)||!tOf.has(r.b))return;
    const same=tOf.get(r.a)===tOf.get(r.b), a=P(r.a).name, b=P(r.b).name;
    if(r.t==='sep'&&same)w.push(`${a} e ${b} estão no mesmo time, mas a regra pede para separar.`);
    if(r.t==='tog'&&!same)w.push(`${a} e ${b} estão em times diferentes, mas a regra pede para juntar.`);
  });
  L.teams.forEach((ids,t)=>{
    const g=ids.filter(id=>roleOf(L,id)==='G').length;
    if(!g)w.push(`${TEAMS[t].n} está sem goleiro.`);
    if(g>1)w.push(`${TEAMS[t].n} está com ${g} goleiros.`);
  });
  if(!ess){
  LINE.forEach(k=>{
    const c=L.teams.map(ids=>ids.filter(id=>roleOf(L,id)===k).length);
    if(Math.max(...c)-Math.min(...c)>1)w.push(`Os ${POS_PL[k][1]} ficaram desiguais entre os times (${c.join(' x ')}).`);
  });
  setorStats(L).forEach(q=>{if(q.gap>=q.x.aviso)w.push(S.showLevels?`${q.x.n} desigual: ${q.t.map((v,t)=>`${TEAMS[t].n} ${fmt1(v.avg)}`).join(' × ')}.`:`${q.x.n} ficou desigual entre os times.`);});
  const sz=L.teams.map(ids=>ids.length);
  if(Math.max(...sz)-Math.min(...sz)>1)w.push(`Os times estão com tamanhos diferentes: ${L.teams.map((ids,t)=>`${TEAMS[t].n} ${ids.length}`).join(', ')}.`);
  }
  if(L.short)w.push(`Faltam ${L.short} jogador${L.short>1?'es':''} de linha para completar os times.`);
  return w;
}

/* ================= quem perdeu sai ================= */
/* L.play = os 2 times em campo. Com 3 times, o que está fora é o próximo a entrar. */
const playOf=L=>L.play||[0,1];
const waitOf=L=>L.teams.map((_,t)=>t).find(t=>!playOf(L).includes(t));
const chegou=id=>{const i=S.queue.indexOf(id);return i<0?1e9:i;};
const isGk=id=>P(id).pos==='G';
/* quem chegou depois do sorteio entra no fim da reserva; quem saiu da chegada sai da reserva */
function syncBench(L){
  const on=new Set([].concat(...L.teams,L.bench));
  L.bench=L.bench.filter(id=>S.queue.includes(id)).concat(S.queue.filter(id=>!on.has(id)));
}
/* quem da reserva forma o próximo time: o 1º goleiro e os primeiros de linha da fila */
function proximos(L){
  const g=L.bench.find(isGk);
  return new Set((g!=null?[g]:[]).concat(L.bench.filter(id=>!isGk(id)).slice(0,S.size-1)));
}
/* o time k perdeu: vai para o fim da reserva (entre eles, na ordem de chegada) e a fila forma o time novo.
   Sem goleiro na reserva, o goleiro de quem perdeu continua. */
function trocaPlan(L,k){
  /* jogos de cada um hoje, contando o que acabou de terminar */
  const emCampo=new Set([].concat(...playOf(L).map(t=>L.teams[t])));
  const jg=id=>((L.jogos||{})[id]||0)+(emCampo.has(id)?1:0);
  const saem=L.teams[k].slice().sort((a,b)=>chegou(a)-chegou(b));
  const fila=L.bench.concat(saem);
  const gRes=L.bench.find(isGk), g=gRes!=null?gRes:saem.find(id=>isGk(id)||roleOf(L,id)==='G');
  /* se a reserva não completa o time, continua quem perdeu e jogou menos; empate, quem chegou primeiro */
  const resto=saem.filter(id=>!isGk(id)&&id!==g).sort((a,b)=>jg(a)-jg(b)||chegou(a)-chegou(b));
  const linha=L.bench.filter(id=>!isGk(id)).concat(resto).slice(0,S.size-1);
  const novo=(g!=null?[g]:[]).concat(linha), usa=new Set(novo);
  const voltam=saem.filter(id=>usa.has(id));
  return {k,w:waitOf(L),saem,novo,g,gFica:g!=null&&gRes==null,voltam,jg,emCampo,bench:fila.filter(id=>!usa.has(id))};
}
/* quem joga em duas posições fica onde o time novo mais precisa, comparando com o adversário */
function papeis(ids,alvo,L){
  const R={};ids.forEach(id=>{R[id]=P(id).pos;});
  const flex=ids.filter(id=>!isGk(id)&&P(id).pos2).slice(0,10), want={};
  LINE.forEach(k=>{want[k]=alvo.filter(id=>roleOf(L,id)===k).length;});
  let best=0,bc=Infinity;
  for(let m=0;m<1<<flex.length;m++){
    const cnt={D:0,L:0,M:0,A:0};let mud=0;
    ids.forEach(id=>{if(isGk(id))return;const f=flex.indexOf(id);if(f>=0&&(m>>f&1)){mud++;cnt[P(id).pos2]++;}else cnt[P(id).pos]++;});
    const c=LINE.reduce((a,k)=>a+Math.abs(cnt[k]-want[k])*10,0)+mud;
    if(c<bc){bc=c;best=m;}
  }
  flex.forEach((id,f)=>{if(best>>f&1)R[id]=P(id).pos2;});
  return R;
}
function trocar(k){
  const L=S.last;syncBench(L);
  const x=trocaPlan(L,k), play=playOf(L), venc=play.find(t=>t!==k);
  const prev={teams:L.teams.map(t=>t.slice()),bench:L.bench.slice(),play:play.slice(),short:L.short||0,roles:Object.assign({},L.roles),jogos:Object.assign({},L.jogos)};
  L.jogos=L.jogos||{};x.emCampo.forEach(id=>{L.jogos[id]=(L.jogos[id]||0)+1;});
  Object.assign(L.roles,papeis(x.novo,L.teams[venc],L));
  if(x.g!=null)L.roles[x.g]='G';
  L.teams[k]=x.novo;L.bench=x.bench;
  if(x.w!=null)L.play=play.map(t=>t===k?x.w:t);
  L.short=Math.max(0,S.size-1-x.novo.filter(id=>!isGk(id)).length);
  L.hist.push({j:L.jogo,p:k,prev});
  L.jogo++;
  return x;
}
/* tirou o time errado: volta ao jogo anterior como estava antes da troca */
function voltarTroca(){
  const L=S.last, h=L.hist.pop();
  Object.assign(L,{teams:h.prev.teams,bench:h.prev.bench,play:h.prev.play,short:h.prev.short,roles:h.prev.roles,jogos:h.prev.jogos||{},jogo:h.j});
  L.teams=L.teams.map(T=>T.filter(x=>S.queue.includes(x)));
  syncBench(L);
}
/* foi embora: sai da chegada e do sorteio; no time, entra o próximo da fila da reserva, na posição dele.
   Goleiro que sai: entra o goleiro da reserva; sem goleiro na reserva, o próximo da fila vai para o gol. */
function embora(id){
  const L=S.last, box=boxOf(L,id), g=isGk(id);
  let entrou=null, t=null;
  if(box==='b')L.bench.splice(L.bench.indexOf(id),1);
  else{
    t=+box;const T=L.teams[t], i=T.indexOf(id), r=roleOf(L,id);
    const linha=L.bench.find(x=>!isGk(x)), gRes=L.bench.find(isGk);
    entrou=g?(gRes!=null?gRes:linha):linha;
    if(entrou!=null){
      L.bench.splice(L.bench.indexOf(entrou),1);T[i]=entrou;
      L.roles[entrou]=g?'G':P(entrou).pos;
    }else T.splice(i,1);
  }
  S.queue=S.queue.filter(x=>x!==id);
  L.sig=sigOf(plan());
  return {entrou,t,g};
}
const podeVoltar=L=>{const h=L.hist[L.hist.length-1];return !!(h&&h.prev&&[].concat(...h.prev.teams,h.prev.bench).every(id=>P(id)));};

  const found=S.players.filter(match).sort(byName).slice(0,6);
  if(!found.length)return `<div class="note">Nenhum jogador com esse nome. <button class="link" data-a="newPlayerQ">Cadastrar “${esc(search.trim())}”</button></div>`;
  return found.map(p=>{
    const i=S.queue.indexOf(p.id);
    if(i<0)return aRow(p);
    return `<div class="arow is-in"><span class="who"><span class="nm">${esc(p.name)}</span><span class="meta">Já chegou, está em ${i+1}º</span></span></div>`;
  }).join('');
}

  const alerta=S.showLevels&&setorStats(L).some(q=>q.gap>=q.x.aviso);

/* ----- nivelamento: junta as avaliações recebidas pelo WhatsApp ----- */
const LV_WORD={leve:1,medio:2,forte:3,'extra forte':4};
const POS_WORD={goleiro:'G',gol:'G',zagueiro:'D',zaga:'D',lateral:'L',meia:'M',meio:'M',atacante:'A',ataque:'A'};
function parseEval(text){
  const m=text.match(/Avaliador:\s*([^\n\r]+)/i);
  if(!m)return {err:'Não achei a linha "Avaliador:" no texto. Copie a mensagem inteira que a pessoa mandou.'};
  const who=m[1].trim(), byName=new Map(S.players.map(p=>[norm(p.name),p])), votes={}, unknown=[];
  text.split(/\r?\n/).forEach(line=>{
    const x=line.match(/^\s*(?:\[[^\]]*\][^:]*:\s*)?([^:|]+?):\s*([^|]*)\|\s*(.*)$/);
    if(!x)return;
    const name=norm(x[1]);
    if(!byName.has(name)){unknown.push(x[1].trim());return;}
    const l=LV_WORD[norm(x[2])]||0;
    const p=x[3].split(',').map(s=>POS_WORD[norm(s)]).filter(Boolean).filter((k,i,a)=>a.indexOf(k)===i).slice(0,2);
    if(l||p.length)votes[name]={l,p};
  });
  if(!Object.keys(votes).length)return {err:'Não encontrei nenhum jogador avaliado nesse texto.'};
  return {who,votes,unknown};
}
function evalResult(){
  const evs=Object.values(S.evals||{});
  return S.players.map(p=>{
    const votes=evs.map(e=>e[norm(p.name)]).filter(Boolean);
    if(!votes.length)return null;
    const lv=votes.filter(v=>v.l).map(v=>v.l);
    const mean=lv.length?lv.reduce((a,b)=>a+b,0)/lv.length:null;
    const level=mean?Math.min(4,Math.max(1,Math.round(mean))):p.level;
    const score={},ment={};let pv=0;
    votes.forEach(v=>{if(v.p.length){pv++;v.p.forEach((k,i)=>{score[k]=(score[k]||0)+(i?1:2);ment[k]=(ment[k]||0)+1;});}});
    let pos=p.pos,pos2=p.pos2;
    if(pv){
      /* principal vale 2 pontos, segunda posição vale 1 */
      const rk=Object.keys(score).sort((a,b)=>score[b]-score[a]||ment[b]-ment[a]||POS.indexOf(a)-POS.indexOf(b));
      pos=rk[0];pos2=null;
      if(pos!=='G')pos2=rk.slice(1).find(k=>k!=='G'&&ment[k]*2>=pv)||null;
    }
    return {p,n:votes.length,nl:lv.length,mean,level,pos,pos2,changed:level!==p.level||pos!==p.pos||pos2!==p.pos2};
  }).filter(Boolean);
}

let cxView='mens', cxMonth='', qtx='';
const F=()=>S.fin;
const cxM=()=>cxMonth||(cxMonth=curYM());
const txName=t=>(t.pid!=null&&P(t.pid))?P(t.pid).name:(t.nome||'');
const txTitle=t=>(t.cat==='mens'||t.cat==='diaria')?(txName(t)||CAT[t.cat].n):(t.desc||txName(t)||CAT[t.cat].n);
const saldoAt=until=>r2(F().cfg.saldoIni+F().tx.reduce((s,t)=>(!until||t.d<=until)?s+t.v:s,0));
const isPaid=(pid,ym)=>F().tx.some(t=>t.cat==='mens'&&t.pid===pid&&t.ref===ym);
function addTx(x){
  if(x.pid!=null&&P(x.pid))x=Object.assign({},x,{nome:P(x.pid).name});
  F().tx.push(txClean(Object.assign({},x,{id:F().nextTx++})));
}
function monthTx(ym){return F().tx.filter(t=>t.d.startsWith(ym)).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);}
function monthSum(ym){
  const tx=monthTx(ym), s={mens:0,diaria:0,entrada:0,local:0,despesa:0,n:{mens:0,diaria:0,entrada:0,local:0,despesa:0},tx};
  tx.forEach(t=>{s[t.cat]=r2(s[t.cat]+t.v);s.n[t.cat]++;});
  s.ent=r2(s.mens+s.diaria+s.entrada);s.sai=r2(s.local+s.despesa);s.res=r2(s.ent+s.sai);
  s.ini=saldoAt(addYM(ym,-1)+'-31');s.fim=saldoAt(ym+'-31');
  return s;
}
/* mensalidade do mês (pelo mês de referência) de cada atleta da turma */
function mensOf(ym){
  return S.players.filter(p=>!p.guest).sort(byName).map(p=>({p,t:F().tx.find(x=>x.cat==='mens'&&x.pid===p.id&&x.ref===ym)}));
}
const despesas=s=>{const e={};s.tx.filter(t=>t.cat==='despesa').forEach(t=>{const k=t.desc||'Despesa';e[k]=r2((e[k]||0)+t.v);});return Object.entries(e);};

/* lançamento por texto, como no Toki: entende atleta, mês, valor e tipo, tudo offline */
const MES_N={janeiro:1,jan:1,fevereiro:2,fev:2,marco:3,mar:3,abril:4,abr:4,maio:5,junho:6,jun:6,julho:7,jul:7,agosto:8,ago:8,setembro:9,set:9,outubro:10,out:10,novembro:11,nov:11,dezembro:12};
const MES_RE=/\b(janeiro|jan|fevereiro|fev|marco|mar|abril|abr|maio|junho|jun|julho|jul|agosto|ago|setembro|set|outubro|out|novembro|nov|dezembro)\b(?:\s+(?:de\s+)?(20\d\d))?/g;
const NUM_W={um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6};
const KW_OUT=/\b(paguei|pagamos|gastei|gastamos|comprei|compramos|despesa|saida)\b/;
const KW_LOCAL=/\b(quadra|areia|aluguel|local|campo|arena)\b/;
const KW_IN=/\b(recebi|recebemos|entrada|doacao|patrocinio|rifa|vaquinha)\b/;
const NOT_NAME=new Set('bola bolas colete coletes agua gelo cone cones rede apito camisa camisas material uniforme churrasco festa rifa bolo'.split(' '));
const STOP=new Set('paguei pagamos pagou pagaram paga gastei gastamos comprei compramos compra recebi recebemos de da do das dos a o as os um uma e com pra para pro no na em reais real r$ hoje ontem anteontem despesa saida entrada mensalidade mensalidades diaria diarias dia mes meses valor'.split(' '));
const reEsc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;let p=Array.from({length:b.length+1},(_,j)=>j);for(let i=1;i<=a.length;i++){const c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[b.length];}
function descOf(raw,found){
  const names=new Set(found.flatMap(p=>norm(p.name).split(/\s+/)));
  const w=raw.replace(/[()!?;:]/g,' ').split(/\s+/).filter(x=>{const n=norm(x).replace(/[.,]+$/,'');return n&&!STOP.has(n)&&!names.has(n)&&!MES_N[n]&&!/^(r\$)?\d/.test(n)&&!/^\d{1,2}\/\d{1,2}/.test(n);});
  const r=w.join(' ').trim();
  return r?r.charAt(0).toUpperCase()+r.slice(1):'';
}
function parseTx(text){
  const raw=String(text||'').trim();
  if(!raw)return {err:'Escreva o lançamento. Ex.: Daniel pagou mensalidade.'};
  const cfg=F().cfg, now=today(), cy=+now.slice(0,4), cm=+now.slice(5,7);
  let t=' '+norm(raw).replace(/[()!?;:]/g,' ').replace(/\s+/g,' ')+' ', m;
  /* atletas: nome inteiro (do mais longo para o mais curto); se nenhum, nome parecido */
  const found=[];
  S.players.slice().sort((a,b)=>norm(b.name).length-norm(a.name).length).forEach(p=>{
    const n=norm(p.name).replace(/[()]/g,' ').replace(/\s+/g,' ').trim();
    const re=new RegExp('(^|[^a-z0-9])'+reEsc(n)+'(?=[^a-z0-9]|$)');
    if(n&&re.test(t)){found.push(p);t=t.replace(re,'$1 ');}
  });
  /* nome parecido só quando o texto não é claramente uma despesa/entrada ('paguei bola 120' não é o Boca) */
  if(!found.length&&!KW_OUT.test(t)&&!KW_IN.test(t))t.split(' ').filter(w=>w.length>=4&&!STOP.has(w)&&!NOT_NAME.has(w)&&!MES_N[w]&&!/\d/.test(w)&&!KW_LOCAL.test(' '+w+' ')).forEach(w=>{
    const c=S.players.filter(p=>{const n=norm(p.name);return !n.includes(' ')&&lev(w,n)<=(n.length>=7?2:1);});
    if(c.length===1&&!found.includes(c[0])){found.push(c[0]);t=t.replace(new RegExp('\\b'+reEsc(w)+'\\b'),' ');}
  });
  /* data */
  let d=now;
  if(/\banteontem\b/.test(t)){d=dayOffset(-2);t=t.replace(/\banteontem\b/,' ');}
  else if(/\bontem\b/.test(t)){d=dayOffset(-1);t=t.replace(/\bontem\b/,' ');}
  if((m=t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))){const y=m[3]?(m[3].length===2?'20'+m[3]:m[3]):String(cy);d=y+'-'+pad(+m[2])+'-'+pad(+m[1]);t=t.replace(m[0],' ');}
  else if((m=t.match(/\bdia (\d{1,2})\b/))){d=now.slice(0,8)+pad(+m[1]);t=t.replace(m[0],' ');}
  /* meses */
  let nMeses=0;
  if((m=t.match(/\b(\d|um|uma|dois|duas|tres|quatro|cinco|seis) mes(?:es)?\b/))){nMeses=+m[1]||NUM_W[m[1]]||0;t=t.replace(m[0],' mensalidade ');}
  const refs=[];
  if(/\b(mes que vem|proximo mes)\b/.test(t)){refs.push(addYM(curYM(),1));t=t.replace(/\b(mes que vem|proximo mes)\b/,' ');}
  if(/\bmes passado\b/.test(t)){refs.push(addYM(curYM(),-1));t=t.replace(/\bmes passado\b/,' ');}
  t=t.replace(MES_RE,(all,w,y)=>{const mm=MES_N[w];let yy=y?+y:cy;if(!y){if(mm>cm+6)yy--;else if(mm<cm-6)yy++;}refs.push(yy+'-'+pad(mm));return ' mensalidade ';});
  /* valor */
  /* valor: o que vem com R$; senão o último número ("comprei 2 bolas 240" = 240) */
  let val=null;
  const nums=[...t.matchAll(/(r\$\s*)?\b(\d{1,3}(?:\.\d{3})+|\d+)(?:[,.](\d{1,2}))?\b/g)];
  if((m=nums.find(x=>x[1])||nums[nums.length-1])){val=+(m[2].replace(/\./g,'')+(m[3]?'.'+m[3]:''));t=t.replace(m[0],' ');}
  const mens=/\bmensalidade/.test(t), diaria=/\b(diaria|avulso|avulsa)\b/.test(t), desc=descOf(raw,found), items=[];
  if(found.length){
    found.forEach(p=>{
      const cat=diaria?'diaria':mens?'mens':(p.guest?'diaria':'mens');
      if(cat==='diaria'){items.push({cat,pid:p.id,nome:p.name,d,v:val!=null?r2(val/found.length):cfg.diaria});return;}
      const months=refs.slice();
      if(!months.length){
        let k=nMeses||1;
        if(!nMeses&&val!=null&&cfg.mens>0&&found.length===1){const q=val/cfg.mens;if(q>1&&Math.abs(q-Math.round(q))<1e-9)k=Math.round(q);}
        let ym=curYM();
        for(let i=0;i<k;i++){while(isPaid(p.id,ym)||months.includes(ym))ym=addYM(ym,1);months.push(ym);}
      }
      const each=val!=null?r2(val/found.length/months.length):cfg.mens;
      months.forEach(ref=>items.push({cat:'mens',pid:p.id,nome:p.name,ref,d,v:each}));
    });
  }else if(KW_IN.test(t)&&!KW_OUT.test(t)){
    items.push({cat:'entrada',pid:null,nome:'',d,v:val??0,desc:desc||'Entrada'});
  }else if(KW_OUT.test(t)||KW_LOCAL.test(t)||val!=null){
    const loc=KW_LOCAL.test(t);
    items.push({cat:loc?'local':'despesa',pid:null,nome:'',d,v:val??(loc?cfg.local:0),desc:desc||(loc?'Aluguel do local':'')});
  }
  if(!items.length)return {err:'Não entendi. Tente “Daniel pagou mensalidade”, “Osni pagou diária 10” ou “paguei a quadra 250”.'};
  return {items};
}

const monthBar=()=>{const ym=cxM();return `<div class="mbar"><button data-a="cxPrev" aria-label="Mês anterior">${ic('left',20)}</button><b>${ymLabel(ym)}</b><button data-a="cxNext" aria-label="Próximo mês"${ym>=addYM(curYM(),12)?' disabled':''}>${ic('right',20)}</button></div>`;};
const txRow=t=>`<button class="arow" data-a="txOpen" data-id="${t.id}"><span class="who"><span class="nm">${esc(txTitle(t))}</span><span class="meta">${CAT[t.cat].n}${t.ref?' · ref. '+ymShort(t.ref):''} · ${dShort(t.d)}${(t.cat==='mens'||t.cat==='diaria')&&t.desc?' · '+esc(t.desc):''}</span></span><span class="money ${t.v>=0?'in':'out'}">${brlS(t.v)}</span></button>`;
function vCaixa(){
  const saldo=saldoAt(), ms=monthSum(curYM());

  if(F().tx.length&&Date.now()-S.lastBackup>7*864e5)h+=`<div class="alert"><p><b>Faça um backup do caixa.</b> Os lançamentos ficam só neste celular. ${S.lastBackup?'Último backup em '+new Date(S.lastBackup).toLocaleDateString('pt-BR')+'.':'Nenhum backup feito ainda.'}</p><p><button class="link" style="padding-left:0" data-a="export">Fazer backup agora</button></p></div>`;
  h+=`<div class="quick"><label class="field">${ic('edit',20)}<input id="qtx" type="text" placeholder="Ex.: Daniel pagou" value="${esc(qtx)}" autocomplete="off" enterkeyhint="send" aria-label="Lançamento por texto"></label><button class="btn btn-pri" data-a="txParse">Lançar</button></div>
    <p class="hint" style="margin-top:8px">Escreva como fala: “Osni pagou diária 10”, “Renan pagou 2 meses”, “paguei a quadra”, “paguei bola 120 ontem”.</p>`;
  h+=`<div class="filters" role="tablist" aria-label="Seções do caixa">${[['mens','Mensalidades'],['tx','Lançamentos'],['rep','Relatório'],['cfg','Ajustes']].map(([k,n])=>`<button role="tab" aria-selected="${cxView===k}" class="${cxView===k?'on':''}" data-a="cxView" data-v="${k}">${n}</button>`).join('')}</div>`;
  h+=({mens:vMens,tx:vTx,rep:vRep,cfg:vCfg})[cxView]();

}
function vMens(){
  const ym=cxM(), rows=mensOf(ym), pagos=rows.filter(r=>r.t);
  let h=monthBar();
  if(!rows.length)return h+`<div class="empty"><b>Nenhum atleta da turma</b><p>Cadastre os atletas em Jogadores. Convidados pagam diária e não entram aqui.</p></div>`;
  const tot=r2(pagos.reduce((s,r)=>s+r.t.v,0));
  h+=`<div class="tally" style="margin-top:0"><div><b>${pagos.length}</b><span>pagaram</span></div><div><b>${rows.length-pagos.length}</b><span>em aberto</span></div><div><b>${tot.toLocaleString('pt-BR')}</b><span>recebido (R$)</span></div></div>`;
  if(!F().cfg.mens)h+=`<p class="hint" style="margin-top:10px">Sem valor fixo de mensalidade: escreva o valor ao lançar (ex.: “${esc((rows[0]||{p:{name:'Lucas'}}).p.name)} pagou 30”). Se passar a ter valor fixo, defina em Ajustes.</p>`;
  h+=`<div class="sec"><h2>Atletas da turma</h2></div><div class="plain">${rows.map(r=>{

  }).join('')}</div>`;
  const dia=monthTx(ym).filter(t=>t.cat==='diaria');
  if(dia.length)h+=`<div class="sec"><h2>Diárias no mês <span class="count">${dia.length}</span></h2></div><div class="plain">${dia.map(txRow).join('')}</div>`;
  return h;
}
function vTx(){
  const ym=cxM(), tx=monthTx(ym);
  const h=monthBar();
  if(!tx.length)return h+`<div class="empty"><b>Nenhum lançamento em ${ymLabel(ym).toLowerCase()}</b><p>Use o campo acima ou o botão + para lançar.</p></div>`;

function repTable(s){
  const row=(a,b,c='')=>`<tr class="${c}"><td>${a}</td><td>${b}</td></tr>`;
  return `<table class="rep">${row('Saldo no início do mês',brl(s.ini),'tot')}
    ${row('Entradas',brl(s.ent),'tot')}${row(`Mensalidades (${s.n.mens})`,brl(s.mens),'sub')}${row(`Diárias (${s.n.diaria})`,brl(s.diaria),'sub')}${s.n.entrada?row(`Outras entradas (${s.n.entrada})`,brl(s.entrada),'sub'):''}
    ${row('Saídas',brl(s.sai),'tot')}${row(`Aluguel do local (${s.n.local})`,brl(s.local),'sub')}${despesas(s).map(([k,v])=>row(esc(k),brl(v),'sub')).join('')}
    ${row('Resultado do mês',brlS(s.res),'tot')}${row('Saldo no fim do mês',brl(s.fim),'tot')}</table>`;
}
function vRep(){

}
function repText(ym){
  const s=monthSum(ym), ms=mensOf(ym), pg=ms.filter(r=>r.t), ab=ms.filter(r=>!r.t);
  const L=[`💰 *Caixa ${'Amigos do Dag'}*`,`*${ymLabel(ym)}*`,'',`Saldo no início do mês: ${brl(s.ini)}`,'',

  if(s.n.entrada)L.push(`• Outras entradas (${s.n.entrada}): ${brl(s.entrada)}`);
  L.push('',`*Saídas: ${brl(s.sai)}*`,`• Aluguel do local (${s.n.local}): ${brl(s.local)}`);

    `✅ Pagaram (${pg.length}): ${pg.map(r=>r.p.name).join(', ')||'ninguém'}`,`⏳ Em aberto (${ab.length}): ${ab.map(r=>r.p.name).join(', ')||'ninguém'}`);
  return L.join('\n');
}

/* ================= aviso com desfazer ================= */
let toastT;
function toast(msg,undo){
  const t=$('#toast');
  undoFn=undo||null;
  t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-a="undo">Desfazer</button>':''}`;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT=setTimeout(()=>{t.classList.remove('show');undoFn=null;},undo?5000:2400);
}
function withUndo(msg,fn){
  const snap=JSON.stringify(S);

function shareOrCopy(txt,msg){
  const copy=()=>{if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(()=>toast(msg),()=>fallbackCopy(txt,msg));else fallbackCopy(txt,msg);};
  if(navigator.share)navigator.share({text:txt}).catch(err=>{if(err&&err.name!=='AbortError')copy();});else copy();
}
function download(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);

function copyText(txt){
  const done=()=>toast('Times copiados.');
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt));

function fallbackCopy(txt,msg='Times copiados.'){
  const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;opacity:0;top:0';
  document.body.appendChild(ta);ta.select();

  ta.remove();toast(ok?msg:'Não deu para copiar neste navegador.');

/* ================= arrastar a fila ================= */
let drag=null;
function layoutDrag(){
  const d=drag;
  let dy=(d.y-d.y0)+(window.scrollY-d.s0);
  dy=Math.max(d.min,Math.min(d.max,dy));
  d.row.style.transform=`translateY(${dy}px) scale(1.02)`;
  const center=d.rects[d.from].top+d.rects[d.from].h/2+dy;
  let to=0;d.rects.forEach((r,i)=>{if(i!==d.from&&r.top+r.h/2<center)to++;});
  if(to!==d.to){d.to=to;vibrate(6);}
  d.rows.forEach((r,i)=>{
    if(i===d.from)return;
    const s=(i>d.from&&i<=to)?-d.h:(i>=to&&i<d.from)?d.h:0;
    r.style.transform=s?`translateY(${s}px)`:'';
  });
}
function dragTick(){
  if(!drag)return;
  const top=$('.bar').getBoundingClientRect().bottom, bot=$('.nav').getBoundingClientRect().top, zone=80;
  let v=0;
  /* só rola na direção em que o dedo está indo */
  if(drag.y<top+zone&&drag.y<drag.y0-8)v=-Math.min(16,Math.ceil((top+zone-drag.y)/5));
  else if(drag.y>bot-zone&&drag.y>drag.y0+8)v=Math.min(16,Math.ceil((drag.y-(bot-zone))/5));
  if(v){const b=window.scrollY;window.scrollBy(0,v);if(window.scrollY!==b)layoutDrag();}
  drag.raf=requestAnimationFrame(dragTick);
}
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.handle');
  if(!h||drag)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  e.preventDefault();
  const row=h.closest('.qrow'), list=row.parentElement, rows=[...list.children], from=rows.indexOf(row), sy=window.scrollY;
  const rects=rows.map(r=>{const b=r.getBoundingClientRect();return {top:b.top+sy,h:b.height};});
  const last=rects[rects.length-1];
  drag={row,list,rows,from,to:from,rects,h:rects[from].h,y0:e.clientY,y:e.clientY,s0:sy,pid:e.pointerId,raf:0,
    min:rects[0].top-rects[from].top, max:(last.top+last.h)-(rects[from].top+rects[from].h)};
  try{h.setPointerCapture(e.pointerId);}catch(_){}
  list.classList.add('sorting');row.classList.add('dragging');
  vibrate(15);layoutDrag();
  drag.raf=requestAnimationFrame(dragTick);
},{passive:false});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  e.preventDefault();drag.y=e.clientY;layoutDrag();
},{passive:false});
function endDrag(e){
  if(!drag||e.pointerId!==drag.pid)return;
  cancelAnimationFrame(drag.raf);
  const d=drag;drag=null;
  if(d.to!==d.from){
    const id=S.queue.splice(d.from,1)[0];S.queue.splice(d.to,0,id);
    flashId=id;save();vibrate(10);
  }
  render();
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);

/* ================= ajuste manual dos times ================= */
const boxOf=(L,id)=>{for(let t=0;t<L.teams.length;t++)if(L.teams[t].includes(id))return String(t);return 'b';};
const boxArr=(L,w)=>w==='b'?L.bench:L.teams[+w];
const boxName=w=>w==='b'?'a reserva':`o ${TEAMS[+w].n}`;
function swapPlayers(a,b){
  const L=S.last, A1=boxArr(L,boxOf(L,a)), B1=boxArr(L,boxOf(L,b));
  A1[A1.indexOf(a)]=b;B1[B1.indexOf(b)]=a;
  flashId=null;save();render();vibrate(10);
  toast(`${P(a).name} e ${P(b).name} trocaram de lugar.`);
}
function movePlayer(id,to){
  const L=S.last, from=boxOf(L,id);
  if(from===to)return;
  const src=boxArr(L,from);src.splice(src.indexOf(id),1);
  boxArr(L,to).push(id);
  flashId=id;save();render();vibrate(10);
  toast(`${P(id).name} foi para ${boxName(to)}.`);
}

function moveBench(id,to){
  const B=S.last.bench, from=B.indexOf(id);if(from<0)return;
  to=Math.max(0,Math.min(B.length-1,to));if(to===from)return;
  withUndo(`${P(id).name} passou para ${to+1}º na reserva.`,()=>{const b=S.last.bench;b.splice(b.indexOf(id),1);b.splice(to,0,id);flashId=id;});
  vibrate(10);
}
/* segurar o nome 1,5 s: o jogador foi embora */

document.addEventListener('pointermove',e=>{if(hold&&e.pointerId===hold.pid&&Math.hypot(e.clientX-hold.x,e.clientY-hold.y)>10)holdStop();});

/* arrastar entre times: uma cópia do jogador segue o dedo */
let tdrag=null;
function tTarget(){
  const t=tdrag, el=document.elementFromPoint(t.cx,t.y);

  const box=el&&el.closest('[data-box]');
  if(box&&box.dataset.box!==t.from)return {type:'move',el:box,box:box.dataset.box};
  return null;
}
function tLayout(){
  const t=tdrag;
  t.ghost.style.transform=`translateY(${t.y-t.y0}px) scale(1.03)`;
  const nt=tTarget();
  if((nt&&nt.el)!==(t.target&&t.target.el)){
    if(t.target)t.target.el.classList.remove('drop-swap','drop-into');
    if(nt){nt.el.classList.add(nt.type==='swap'?'drop-swap':'drop-into');vibrate(5);}
  }

}
function tTick(){
  if(!tdrag)return;
  const top=$('.bar').getBoundingClientRect().bottom, bot=$('.nav').getBoundingClientRect().top, zone=90;
  const moved=Math.abs(tdrag.y-tdrag.y0)>10;
  let v=0;
  if(moved&&tdrag.y<top+zone)v=-Math.min(18,Math.ceil((top+zone-tdrag.y)/4));
  else if(moved&&tdrag.y>bot-zone)v=Math.min(18,Math.ceil((tdrag.y-(bot-zone))/4));
  if(v){const b=window.scrollY;window.scrollBy(0,v);if(window.scrollY!==b)tLayout();}
  tdrag.raf=requestAnimationFrame(tTick);
}
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.thandle');
  if(!h||tdrag||drag||!S.last)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  e.preventDefault();
  const li=h.closest('.tli'), r=li.getBoundingClientRect(), id=+li.dataset.id;
  const ghost=li.cloneNode(true);
  ghost.classList.add('ghost');ghost.classList.remove('flash');

  tdrag={id,li,ghost,from:boxOf(S.last,id),cx:r.left+r.width/2,y0:e.clientY,y:e.clientY,pid:e.pointerId,target:null,raf:0};
  try{h.setPointerCapture(e.pointerId);}catch(_){}
  document.body.classList.add('tdragging');
  vibrate(15);tLayout();
  tdrag.raf=requestAnimationFrame(tTick);
},{passive:false});
document.addEventListener('pointermove',e=>{

function tEnd(e){
  if(!tdrag||e.pointerId!==tdrag.pid)return;
  cancelAnimationFrame(tdrag.raf);
  const t=tdrag;tdrag=null;
  t.ghost.remove();t.li.classList.remove('lifted');
  if(t.target)t.target.el.classList.remove('drop-swap','drop-into');
  document.body.classList.remove('tdragging');
  if(e.type==='pointercancel'||!t.target)return;
  if(t.target.type==='swap'){
    if(boxOf(S.last,t.target.id)===t.from){if(t.from==='b')moveBench(t.id,S.last.bench.indexOf(t.target.id));else toast('Os dois já estão no mesmo time.');return;}
    swapPlayers(t.id,t.target.id);
  }else movePlayer(t.id,t.target.box);
}
document.addEventListener('pointerup',tEnd);
document.addEventListener('pointercancel',tEnd);

/* ================= ações ================= */
const A={
  tab(el){tab=el.dataset.tab;search='';pick=null;try{localStorage.setItem(TAB_KEY,tab);}catch(e){}render();window.scrollTo(0,0);},
  clearSearch(){search='';render();const q=$('#q');if(q)q.focus();},
  undo(){if(undoFn){const f=undoFn;undoFn=null;$('#toast').classList.remove('show');f();}},

  /* chegada */
  enqueue(el){
    const id=+el.dataset.id;if(S.queue.includes(id))return;
    const fromSearch=!!el.closest('#qres');
    S.queue.push(id);flashId=id;save();vibrate(10);
    const p=P(id);
    if(fromSearch)search='';
    render();
    toast(`${p.name} chegou em ${S.queue.length}º.`);
    if(fromSearch){const q=$('#q');if(q)q.focus();}
  },
  unqueue(el){const id=+el.dataset.id, p=P(id);withUndo(`${p.name} saiu da fila.`,()=>{S.queue=S.queue.filter(x=>x!==id);});},
  clearQueue(){if(!S.queue.length)return;withUndo('Ordem de chegada zerada.',()=>{S.queue=[];S.last=null;pick=null;});},
  toggleAbs(){absOpen=!absOpen;render();},
  moveTo(el){sheet={type:'move',id:+el.dataset.id};renderSheet();},
  mvStep(el){const i=$('#mvPos');const n=+i.max||S.queue.length;i.value=Math.max(1,Math.min(n,(+i.value||1)+ +el.dataset.v));},
  mvSet(el){const id=sheet.id;closeSheet();moveQueue(id,+el.dataset.v-1);render();},
  mvGo(){const id=sheet.id, v=+$('#mvPos').value||1;closeSheet();moveQueue(id,v-1);render();},
  bmove(el){if(!S.last)return;pick=null;sheet={type:'bmove',id:+el.dataset.id};renderSheet();},
  bmSet(el){const id=sheet.id;closeSheet();moveBench(id,+el.dataset.v-1);},
  bmGo(){const id=sheet.id, v=+$('#mvPos').value||1;closeSheet();moveBench(id,v-1);},

  /* jogadores */
  newPlayer(){openPlayer(null);},
  newPlayerQ(){openPlayer(null,{enqueue:true,name:search.trim()});},
  edit(el){openPlayer(+el.dataset.id);},
  pfilter(el){pfilter=el.dataset.v;render();},
  closeSheet(){closeSheet();},
  dLevel(el){syncName();sheet.d.level=+el.dataset.v;renderSheet();},
  dPos(el){syncName();const d=sheet.d;d.pos=el.dataset.v;if(d.pos==='G'){d.pos2=null;d.level=4;}else if(d.pos2===d.pos)d.pos2=null;renderSheet();},
  dPos2(el){syncName();sheet.d.pos2=el.dataset.v||null;renderSheet();},
  dGuest(){syncName();sheet.d.guest=!sheet.d.guest;renderSheet();},
  saveP(){
    syncName();
    const d=sheet.d, name=d.name.trim().replace(/\s+/g,' ');
    if(!name){toast('Digite o nome do jogador.');$('#fname').focus();return;}
    if(S.players.some(p=>p.id!==d.id&&norm(p.name)===norm(name))){toast(`Já existe um jogador chamado ${name}.`);return;}
    let msg;
    if(d.id){const p=P(d.id);Object.assign(p,{name,level:d.level,pos:d.pos,pos2:d.pos2,guest:!!d.guest});msg='Alterações salvas.';}
    else{
      const id=S.nextId++;S.players.push({id,name,level:d.level,pos:d.pos,pos2:d.pos2,guest:!!d.guest});
      if(d.enqueue){S.queue.push(id);flashId=id;msg=`${name} cadastrado e chegou em ${S.queue.length}º.`;search='';}
      else msg=`${name} cadastrado.`;
    }
    closeSheet();save();render();toast(msg);
  },
  delP(){
    const id=sheet.d.id, p=P(id);closeSheet();
    withUndo(`${p.name} excluído.`,()=>{
      S.players=S.players.filter(x=>x.id!==id);
      S.rules=S.rules.filter(r=>r.a!==id&&r.b!==id);
      S.queue=S.queue.filter(x=>x!==id);
      if(S.last&&[].concat(...S.last.teams,S.last.bench).includes(id))S.last=null;
    });
  },

  /* regras */
  ruleT(el){ruleT=el.dataset.v;render();},
  addRule(){
    const a=+$('#ra').value, b=+$('#rb').value;
    if(!a||!b){toast('Escolha os dois jogadores.');return;}
    if(a===b){toast('Escolha dois jogadores diferentes.');return;}
    if(S.rules.some(r=>(r.a===a&&r.b===b)||(r.a===b&&r.b===a))){toast('Esses dois já têm uma regra.');return;}
    S.rules.push({a,b,t:ruleT});ruleA='';ruleB='';save();render();toast('Regra adicionada.');
  },
  delRule(el){const i=+el.dataset.i;withUndo('Regra removida.',()=>{S.rules.splice(i,1);});},

  /* times */
  setT(el){S.nTeams=+el.dataset.v;S.last=null;pick=null;save();render();},
  sz(el){S.size=Math.min(11,Math.max(4,S.size+ +el.dataset.v));S.last=null;pick=null;save();render();},
  lv(){S.showLevels=!S.showLevels;save();render();},
  cfg(){cfgOpen=!cfgOpen;render();},
  bal(){balOpen=!balOpen;try{localStorage.setItem('pelada.balOpen',balOpen?'1':'0');}catch(e){}render();},
  draw(){
    const r=run();
    if(r.err){toast(r.err);return;}
    /* depois de trocas, sortear de novo pode ser desfeito */
    cfgOpen=false;
    if(S.last&&S.last.jogo>1)withUndo('Times sorteados de novo. Voltou para o 1º jogo.',()=>{S.last=r;pick=null;});
    else{S.last=r;pick=null;save();render();}
    vibrate(20);
    const b=$('.jogo');if(b)window.scrollTo({top:b.getBoundingClientRect().top+window.scrollY-$('.bar').offsetHeight-12,behavior:'smooth'});
  },
  pick(el){
    if(holdFired){holdFired=false;return;}
    const id=+el.dataset.id;
    if(pick==null||pick===id){pick=pick===id?null:id;render();return;}
    if(boxOf(S.last,pick)===boxOf(S.last,id)){if(boxOf(S.last,id)==='b'){const a=pick;pick=null;moveBench(a,S.last.bench.indexOf(id));return;}pick=id;render();return;}
    const a=pick;pick=null;swapPlayers(a,id);
  },
  share(){
    const txt=teamsText();
    if(navigator.share)navigator.share({text:txt}).catch(err=>{if(err&&err.name!=='AbortError')copyText(txt);});
    else copyText(txt);
  },
  copy(){copyText(teamsText());},
  voltar(){
    const L=S.last;if(!L||!podeVoltar(L))return;
    const h=L.hist[L.hist.length-1];
    withUndo(`Voltou ao ${h.j}º jogo, antes de o ${TEAMS[h.p].n} sair.`,()=>{voltarTroca();pick=null;});
  },
  perdeu(el){if(!S.last)return;syncBench(S.last);pick=null;sheet={type:'troca',k:+el.dataset.v};renderSheet();},
  trocaOk(){
    const k=sheet.k, w=waitOf(S.last), n=S.last.jogo+1;closeSheet();
    withUndo(`${w!=null?TEAMS[w].n+' entra':'Time novo no '+TEAMS[k].n}. Começa o ${n}º jogo.`,()=>{trocar(k);});
    vibrate(20);
    const b=$('.jogo');if(b)window.scrollTo({top:b.getBoundingClientRect().top+window.scrollY-$('.bar').offsetHeight-12,behavior:'smooth'});
  },

  /* dados */
  export(){
    S.lastBackup=Date.now();save();
    const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`amigos-do-dag-${today()}.json`;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    render();toast('Backup exportado. Guarde o arquivo fora do celular.');
  },
  import(){$('#file').click();},
  evalLink(){
    const url=new URL('avaliacao.html',location.href).href;
    const text='Ajuda a nivelar a turma do Amigos do Dag? Abra o link, marque nível e posição de cada um e toque em Enviar avaliação.';
    if(navigator.share)navigator.share({title:'Avaliação Amigos do Dag',text,url}).catch(err=>{if(err&&err.name!=='AbortError')copyLink();});
    else copyLink();
    function copyLink(){
      const t=text+'\n'+url;
      if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('Link copiado. Cole no WhatsApp.'),()=>fallbackCopy(t,'Link copiado. Cole no WhatsApp.'));else fallbackCopy(t,'Link copiado. Cole no WhatsApp.');
    }
  },
  evalPaste(){sheet={type:'eval'};renderSheet();setTimeout(()=>{const t=$('#evalTxt');if(t)t.focus();},280);},
  evalAdd(){
    const r=parseEval($('#evalTxt').value||'');
    if(r.err){toast(r.err);return;}
    S.evals=S.evals||{};
    const again=!!S.evals[r.who];
    S.evals[r.who]=r.votes;
    closeSheet();save();render();
    toast(`${again?'Avaliação atualizada':'Avaliação adicionada'}: ${r.who}, ${Object.keys(r.votes).length} jogadores.${r.unknown.length?` Não achei: ${r.unknown.join(', ')}.`:''}`);
  },
  evalDel(el){const w=el.dataset.w;withUndo(`Avaliação de ${w} removida.`,()=>{delete S.evals[w];});},
  nivelAll(){nivelAll=!nivelAll;render();},
  evalApply(){
    const ch=evalResult().filter(r=>r.changed);
    withUndo(`${ch.length} jogador${ch.length>1?'es':''} atualizado${ch.length>1?'s':''}.`,()=>{
      ch.forEach(r=>{const p=P(r.p.id);p.level=r.level;p.pos=r.pos;p.pos2=r.pos2;});
    });
  },
  turma(){
    if(S.players.length&&!confirm('Isso troca a lista atual pela lista da turma e apaga as regras e a chegada de hoje. Continuar?'))return;
    withUndo('Lista da turma carregada.',()=>{turmaInto(S);});
  },
  simQ(){
    if(!S.players.length){toast('Cadastre jogadores primeiro.');return;}
    const T=S.nTeams, g=shuffle(S.players.filter(p=>p.pos==='G')).slice(0,T);
    const o=shuffle(S.players.filter(p=>p.pos!=='G')).slice(0,T*(S.size-1)+2);
    S.queue=shuffle(g.concat(o)).map(p=>p.id);S.last=null;pick=null;
    save();tab='chegada';search='';render();window.scrollTo(0,0);toast('Chegada simulada.');
  },
  /* caixa */
  cxView(el){cxView=el.dataset.v;render();},
  cxPrev(){cxMonth=addYM(cxM(),-1);render();},
  cxNext(){cxMonth=addYM(cxM(),1);render();},
  txParse(){
    const i=$('#qtx');if(i)qtx=i.value;
    const r=parseTx(qtx);
    if(r.err){toast(r.err);return;}
    sheet={type:'txs',items:r.items};renderSheet();
  },
  txItemEdit(el){const i=+el.dataset.i;sheet={type:'txe',d:Object.assign({},sheet.items[i]),items:sheet.items,i};renderSheet();},
  txItemDel(el){sheet.items.splice(+el.dataset.i,1);if(!sheet.items.length)closeSheet();else renderSheet();},
  txConfirm(){
    const items=sheet.items, bad=items.find(x=>!(Math.abs(x.v)>0));
    if(bad){toast(`Falta o valor em “${txTitle(bad)}”. Toque em Editar.`);return;}
    if(items.some(x=>(x.cat==='mens'||x.cat==='diaria')&&x.pid==null&&!x.nome)){toast('Escolha o atleta. Toque em Editar.');return;}
    closeSheet();qtx='';
    withUndo(`${items.length} lançamento${items.length>1?'s':''} registrado${items.length>1?'s':''}.`,()=>{items.forEach(addTx);});
  },
  txNew(){sheet={type:'txe',d:{cat:cxView==='mens'?'mens':'despesa',pid:null,nome:'',ref:cxM(),d:today(),v:0,desc:''}};renderSheet();},
  txOpen(el){const t=F().tx.find(x=>x.id===+el.dataset.id);if(!t)return;sheet={type:'txe',d:Object.assign({},t)};renderSheet();},
  mensRow(el){
    const id=+el.dataset.id, ym=cxM(), t=F().tx.find(x=>x.cat==='mens'&&x.pid===id&&x.ref===ym);
    sheet={type:'txe',d:t?Object.assign({},t):{cat:'mens',pid:id,nome:P(id).name,ref:ym,d:today(),v:F().cfg.mens,desc:''}};
    renderSheet();
  },
  txSave(){
    syncTx();const d=sheet.d;
    if(!(Math.abs(d.v)>0)){toast('Informe o valor.');return;}
    if((d.cat==='mens'||d.cat==='diaria')&&d.pid==null&&!d.nome){toast('Escolha o atleta.');return;}
    if(d.cat==='mens'&&!/^\d{4}-\d\d$/.test(d.ref||'')){toast('Escolha o mês da mensalidade.');return;}
    if(sheet.items){sheet.items[sheet.i]=d;sheet={type:'txs',items:sheet.items};renderSheet();return;}
    closeSheet();
    if(d.id)withUndo('Lançamento alterado.',()=>{const i=F().tx.findIndex(x=>x.id===d.id);if(i>=0){if(d.pid!=null&&P(d.pid))d.nome=P(d.pid).name;F().tx[i]=txClean(d);}});
    else withUndo('Lançamento registrado.',()=>{addTx(d);});
  },
  txBack(){if(sheet.items){sheet={type:'txs',items:sheet.items};renderSheet();}else closeSheet();},
  txDel(){const id=sheet.d.id;closeSheet();withUndo('Lançamento apagado.',()=>{F().tx=F().tx.filter(x=>x.id!==id);});},
  cfgSave(){
    const g=id=>parseMoney($('#'+id).value), v={mens:g('cmens'),diaria:g('cdia'),local:g('cloc'),saldoIni:g('cini')};
    if(Object.values(v).some(x=>!Number.isFinite(x))){toast('Algum valor está inválido.');return;}
    withUndo('Valores salvos.',()=>{Object.assign(F().cfg,{mens:Math.max(0,r2(v.mens)),diaria:Math.max(0,r2(v.diaria)),local:Math.max(0,r2(v.local)),saldoIni:r2(v.saldoIni)});});
  },
  repShare(){shareOrCopy(repText(cxM()),'Relatório copiado.');},
  repCsv(){download(`amigos-do-dag-caixa-${cxM()}.csv`,repCsv(cxM()),'text/csv;charset=utf-8');toast('Planilha baixada.');},
  repPrint(){
    const ym=cxM(), s=monthSum(ym), ms=mensOf(ym), pg=ms.filter(r=>r.t), ab=ms.filter(r=>!r.t);
    $('#print').innerHTML=`<h1>Caixa ${esc('Amigos do Dag')}</h1><p>${ymLabel(ym)} · gerado em ${new Date().toLocaleDateString('pt-BR')}</p>${repTable(s)}
      <h2>Saldo atual do caixa: ${brl(saldoAt())}</h2>
      <h2>Mensalidades</h2><p><b>Pagaram (${pg.length}):</b> ${pg.map(r=>esc(r.p.name)).join(', ')||'ninguém'}</p><p><b>Em aberto (${ab.length}):</b> ${ab.map(r=>esc(r.p.name)).join(', ')||'ninguém'}</p>
      <h2>Lançamentos do mês</h2><table class="rep">${monthTx(ym).slice().reverse().map(t=>`<tr><td>${dShort(t.d)} · ${esc(CAT[t.cat].n)} · ${esc(txTitle(t))}${t.ref?' (ref. '+ymShort(t.ref)+')':''}</td><td>${brlS(t.v)}</td></tr>`).join('')}</table>`;
    window.print();
  },

  wipe(){
    if(!confirm('Apagar todos os jogadores, regras e a chegada de hoje? O caixa continua.'))return;
    withUndo('Tudo apagado (o caixa continua).',()=>{
      S.fin.tx.forEach(t=>{if(t.pid!=null){t.nome=txName(t);t.pid=null;}});
      S=Object.assign(blank(),{day:today(),seeded:true,turmaV:TURMA_V,nivelV:NIVEL_V,fin:S.fin,lastBackup:S.lastBackup});
    });
  }
};

/* ================= eventos ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el||el.disabled)return;
  const f=A[el.dataset.a];if(f)f(el,e);
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){search=e.target.value;refreshSearch();}
  if(e.target.id==='qtx')qtx=e.target.value;
});
document.addEventListener('change',e=>{
  if(e.target.id==='ra')ruleA=e.target.value;
  if(e.target.id==='rb')ruleB=e.target.value;
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&sheet){closeSheet();return;}
  if(e.key!=='Enter')return;
  if(e.target.id==='fname'){e.preventDefault();A.saveP();}
  else if(e.target.id==='mvPos'){e.preventDefault();A.mvGo();}
  else if(e.target.id==='qtx'){e.preventDefault();A.txParse();}
  else if(e.target.id==='q'&&tab==='chegada'){
    e.preventDefault();
    const first=$('#qres [data-a="enqueue"]');
    if(first)A.enqueue(first);else if(search.trim()&&!S.players.some(match))A.newPlayerQ();
  }
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&checkDay())render();});
setInterval(()=>{if(checkDay())render();},60000);
$('#file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    let d;try{d=JSON.parse(r.result);}catch(err){toast('Este arquivo não é um backup da pelada.');return;}
    if(!d||!Array.isArray(d.players)){toast('Este arquivo não é um backup da pelada.');return;}
    if(S.players.length&&!confirm(`Trocar a lista atual pelos ${d.players.length} jogadores do arquivo?`))return;
    withUndo('Dados importados.',()=>{S=sanitize(d);S.day=S.day||today();});
    checkDay();
  };
  r.readAsText(f);e.target.value='';
});

/* ================= início ================= */
checkDay();
save();
render();
/* instalado como app: guarda os arquivos para abrir sem internet */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
